name: Build & Release BiteLog Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Web Application
        working-directory: Frontend
        run: npm run build

      - name: Copy Web Assets to Android
        working-directory: Frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        working-directory: Frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: Frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          cp Frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/BiteLog-v1.2.apk
          ls -lh build-output/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiteLog-Android-APK
          path: build-output/BiteLog-v1.2.apk
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.1' }}"
          echo "Publishing GitHub Release for tag: $TAG"
          gh release create "$TAG" build-output/BiteLog-v1.2.apk \
            --title "BiteLog Android App $TAG" \
            --notes "### 📱 BiteLog $TAG - 100% Offline Calorie & Nutrition Tracker

Download **BiteLog-v1.2.apk** below to install directly on your Android smartphone!

#### 🌟 Features:
- **100% Offline & Private**: Zero cloud dependencies, zero telemetry, 0 bytes of food photos saved to disk (processed strictly in RAM).
- **Google Gemma 3n Offline Food Vision**: Instant plate analysis with portion scaling and cooking style compensation.
- **6 Meal Categories**: Breakfast, Morning Snacks, Lunch, Evening Snacks, Dinner, Midnight Craving.
- **Interactive Reports & Export**: 6 selectable intervals, CSV download, and Print/PDF modal with ✔ Achieved badges.
- **Meet the Creator Screen**: Learn about Sri Harsha Juttu and the privacy-first principles of BiteLog.

#### 📲 Installation Instructions:
1. Download **BiteLog-v1.2.apk** on your Android smartphone.
2. Tap the downloaded file. When prompted, allow *'Install from unknown sources'* for your browser/file manager.
3. Tap **Install** and launch **BiteLog**!" \
            --clobber
