name: Build & Release BiteLog Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Web Application
        working-directory: Frontend
        run: npm run build

      - name: Copy Web Assets to Android
        working-directory: Frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Grant Execute Permission to Gradlew
        working-directory: Frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: Frontend/android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          echo "Searching for compiled APK..."
          find . -name "*.apk"
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated by Gradle!"
            find Frontend/android -type d -name "build"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/BiteLog-v1.2.apk
          ls -lh build-output/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BiteLog-Android-APK
          path: build-output/BiteLog-v1.2.apk
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v1.2.1"
          fi
          echo "Publishing GitHub Release for tag: $TAG"
          
          cat << 'EOF' > release_notes.md
          ### 📱 BiteLog Android App - 100% Offline Calorie & Nutrition Tracker

          Download **BiteLog-v1.2.apk** below to install directly on your Android smartphone!

          #### 🌟 Features:
          - **100% Offline & Private**: Zero cloud dependencies, zero telemetry, 0 bytes of food photos saved to disk (processed in RAM).
          - **Google Gemma 3n Offline Food Vision**: Instant plate analysis with portion scaling and cooking style compensation.
          - **6 Meal Categories**: Breakfast, Morning Snacks, Lunch, Evening Snacks, Dinner, Midnight Craving.
          - **Interactive Reports & Export**: 6 selectable intervals, CSV download, and Print/PDF modal with ✔ Achieved badges.
          - **Meet the Creator Screen**: Learn about Sri Harsha Juttu and the privacy-first principles of BiteLog.

          #### 📲 Installation Instructions:
          1. Download **BiteLog-v1.2.apk** on your Android smartphone.
          2. Tap the downloaded file. When prompted, allow *'Install from unknown sources'* for your browser/file manager.
          3. Tap **Install** and launch **BiteLog**!
          EOF

          gh release create "$TAG" build-output/BiteLog-v1.2.apk \
            --title "BiteLog Android App $TAG" \
            --notes-file release_notes.md \
            --clobber
